<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="formulario.css">
    <title>Document</title>
</head>
<body>
    <h1>Formulário de contato</h1>

    <form>
        <label for="nome">Nome</label>
        <input id="nome" name="nome" type="text" placeholder="Digite um nome" required minlength="5">
        <br>

        <label for="email">E-Mail</label>
        <input id="email" name="email" type="email" placeholder="nome@email.com" required>
        <br>

        <label for="telefone">Telefone</label>
        <input id="telefone" type="text" minlength="6" required>
        <br>

        <label>Sexo</label>
        <input name="sexo" id="f" type="radio" value="f"><label for="f">F</label>
        <input name="sexo" id="m" type="radio" value="m"><label for="m">M</label>
        <br>

        <label for="nasc">Data de nascimento</label>
        <input id="nasc" type="date" required>
        <br>

        <label for="nota">Avaliação do nosso site</label>
        0<input id="nota" type=range min="0" max="10">10
        <br>

        <label for="msg">Mensagem</label>
        <br>
        <textarea id="msg"></textarea>
        <br>

        <button type="submit" value="Enviar">Enviar</button>
    
    
    </form>
</body>
</html>
